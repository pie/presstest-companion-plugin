name: Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to create releases and push version bumps

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set version from tag
        run: echo "VERSION=$GITHUB_REF_NAME" >> $GITHUB_ENV

      - name: Bump version in plugin files
        run: |
          sed -i "s/Version:           [0-9]\+\.[0-9]\+\.[0-9]\+/Version:           $VERSION/" presstest-companion.php
          sed -i "s/define( 'PRESSTEST_COMPANION_VERSION', '[0-9]\+\.[0-9]\+\.[0-9]\+' )/define( 'PRESSTEST_COMPANION_VERSION', '$VERSION' )/" definitions.php

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build JS/CSS assets
        run: npm ci && npm run build

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Install Composer dependencies (production only)
        run: composer install --no-dev --optimize-autoloader

      - name: Build release ZIP
        run: |
          zip -r presstest-companion.zip . \
            --exclude "*.git*" \
            --exclude "src/*" \
            --exclude "node_modules/*" \
            --exclude ".github/*" \
            --exclude "composer.json" \
            --exclude "composer.lock" \
            --exclude "package.json" \
            --exclude "package-lock.json" \
            --exclude ".distignore"

      - name: Update update.json
        run: |
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/presstest-companion.zip"
          DATE=$(date -u +"%Y-%m-%d %H:%M:%S")
          jq \
            --arg version "$VERSION" \
            --arg download_url "$DOWNLOAD_URL" \
            --arg last_updated "$DATE" \
            --arg changelog "<h4>$VERSION</h4><ul><li>See <a href=\"https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}\">release notes</a> for details.</li></ul>" \
            '.version = $version | .download_url = $download_url | .last_updated = $last_updated | .sections.changelog = $changelog' \
            update.json > update.json.tmp && mv update.json.tmp update.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: presstest-companion.zip
          generate_release_notes: true

      - name: Commit version bumps and updated update.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add presstest-companion.php definitions.php update.json
          git commit -m "chore: bump version to ${{ github.ref_name }}"
          git push origin HEAD:production --force

      - uses: pie/.github/actions/add-ssh-config@main
        name: Add SSH key
        with:
          ssh-user: root
          ssh-host: api.presstest.io
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy update.json to droplet
        run: scp update.json server:/var/www/presstest-update/presstest-companion.json
